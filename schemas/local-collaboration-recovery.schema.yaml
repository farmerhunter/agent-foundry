$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-foundry.local/schemas/local-collaboration-recovery.schema.yaml
title: LocalCollaborationRecovery-v1
oneOf:
  - $ref: '#/$defs/summary'
  - $ref: '#/$defs/action_result'
  - $ref: '#/$defs/held'
  - $ref: '#/$defs/setup_incomplete'
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  opaque: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
  flags:
    type: object
    additionalProperties: false
    required: [source_unlock_performed, automatic_recovery, deletion_performed, transport_performed, global_convergence_verified]
    properties:
      source_unlock_performed: {const: false}
      automatic_recovery: {const: false}
      deletion_performed: {const: false}
      transport_performed: {const: false}
      global_convergence_verified: {const: false}
  summary:
    type: object
    additionalProperties: false
    required: [schema_version, project_id, state, next_action, mutation_performed, summary_digest, source_unlock_performed, automatic_recovery, deletion_performed, transport_performed, global_convergence_verified]
    properties:
      schema_version: {const: LocalCollaborationRecovery-v1}
      project_id: {type: string, format: uuid}
      state: {enum: [healthy_active, recovery_action_ready, source_locked_target_not_exposed, target_active_source_locked, reverse_handoff_required, setup_incomplete, held]}
      next_action: {enum: [none, status_only, create_backup, restore_fresh_target, cancel_pre_export_handoff, revoke_inactive_replica, takeover_from_accepted_frontier, start_reverse_handoff, resolve_hold]}
      reason_code: {$ref: '#/$defs/opaque'}
      summary_digest: {$ref: '#/$defs/digest'}
      before_generation: {type: integer, minimum: 0}
      before_head: {$ref: '#/$defs/digest'}
      before_state_digest: {$ref: '#/$defs/digest'}
      selected_replica_id: {$ref: '#/$defs/opaque'}
      handoff_id: {$ref: '#/$defs/opaque'}
      bundle_locator_digest: {$ref: '#/$defs/digest'}
      proof_locator_digest: {$ref: '#/$defs/digest'}
      projection_digest: {$ref: '#/$defs/digest'}
      target_generation: {type: integer, minimum: 0}
      target_head: {$ref: '#/$defs/digest'}
      frontier_digest: {$ref: '#/$defs/digest'}
      mutation_performed: {const: false}
      source_unlock_performed: {const: false}
      automatic_recovery: {const: false}
      deletion_performed: {const: false}
      transport_performed: {const: false}
      global_convergence_verified: {const: false}
    allOf:
      - if: {properties: {state: {const: held}}, required: [state]}
        then: {required: [reason_code], properties: {next_action: {const: resolve_hold}}}
  receipt:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, project_id, operation, operation_fingerprint, decision_id, decision_digest, before_generation, before_head, before_state_digest, after_generation, after_head, after_state_digest, locator_digests, owner_outcome, mutation_performed, duplicate, source_unlock_performed, automatic_recovery, deletion_performed, transport_performed, global_convergence_verified]
    properties:
      schema_version: {const: LocalCollaborationRecovery-v1}
      outcome: {enum: [recovery_action_applied, recovery_action_duplicate]}
      project_id: {type: string, format: uuid}
      operation: {enum: [create_backup, restore_fresh_target, cancel_pre_export_handoff, revoke_inactive_replica, takeover_from_accepted_frontier]}
      operation_fingerprint: {$ref: '#/$defs/digest'}
      decision_id: {$ref: '#/$defs/opaque'}
      decision_digest: {$ref: '#/$defs/digest'}
      before_generation: {type: integer, minimum: 0}
      before_head: {$ref: '#/$defs/digest'}
      before_state_digest: {$ref: '#/$defs/digest'}
      after_generation: {type: integer, minimum: 0}
      after_head: {$ref: '#/$defs/digest'}
      after_state_digest: {$ref: '#/$defs/digest'}
      locator_digests:
        type: object
        additionalProperties: false
        patternProperties: {'^[a-z_]+_digest$': {$ref: '#/$defs/digest'}}
      selected_replica_id: {$ref: '#/$defs/opaque'}
      owner_outcome: {$ref: '#/$defs/opaque'}
      mutation_performed: {type: boolean}
      duplicate: {type: boolean}
      source_unlock_performed: {const: false}
      automatic_recovery: {const: false}
      deletion_performed: {const: false}
      transport_performed: {const: false}
      global_convergence_verified: {const: false}
  action_result:
    type: object
    additionalProperties: false
    required: [receipt, next_summary]
    properties:
      receipt: {$ref: '#/$defs/receipt'}
      next_summary: {$ref: '#/$defs/summary'}
  held:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, reason_code]
    properties:
      schema_version: {const: LocalCollaborationRecovery-v1}
      outcome: {const: held}
      reason_code: {$ref: '#/$defs/opaque'}
  setup_incomplete:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, receipt, next_summary]
    properties:
      schema_version: {const: LocalCollaborationRecovery-v1}
      outcome: {const: setup_incomplete}
      receipt: {$ref: '#/$defs/receipt'}
      next_summary: {$ref: '#/$defs/summary'}
