schema_version: "1.0.0"
title: Local Collaboration Ledger
description: Project-local SQLite authority for compact, privacy-safe collaboration events.
authority:
  backend: sqlite
  database: collaboration.db
  jsonl: forbidden
  raw_transcript: forbidden
storage:
  directory_mode: "0700"
  file_mode: "0600"
  journal_mode: WAL
  synchronous: FULL
  foreign_keys: true
  trusted_schema: false
  busy_timeout_ms: 5000
  wal_autocheckpoint: 1000
  existing_write_open: mode_rw_only
  missing_authority: hold
authority_snapshot:
  api: authority_snapshot
  connection: existing_authority_mode_ro_wal_aware_read_transaction
  receipt: [project_id, schema_version, authority_generation, authority_head, events]
  authority_generation: last_committed_event_sequence_or_0
  authority_head: last_committed_event_hash_or_genesis
  validation: [project_identity, schema_version, contiguous_sequence, payload_hash, event_hash_chain]
  business_state_mutation: forbidden
  sqlite_coordination_files: permitted
  latest_at_return: false
  failure: fail_closed
conditional_append_batch:
  api: conditional_append_batch
  transaction: BEGIN_IMMEDIATE
  expected_pair: [generation, head]
  success: [appended, duplicate]
  duplicate: exact_full_batch_post_commit_retry_only
  stale_snapshot: no_business_mutation
  receipt: [status, generation, head, event_refs, mutation_performed]
  callbacks_and_domain_predicates: forbidden
identity:
  project_id: opaque_uuid
  bindings_non_authoritative: [path, remote, thread, issue]
  resolution: exactly_one_or_hold
  historical_rebind: retained_with_decision_receipt
events:
  append_only: true
  sequence: monotonic_committed_integer
  idempotency: event_id_and_payload_hash
  divergent_duplicate: hold
  identity: [payload_hash, event_type, actor, source, root]
  root: project_id
  integrity: internal_sha256_hash_chain
  transaction: BEGIN_IMMEDIATE
privacy:
  allowed: [event_id, event_type, payload, actor, created_at, source]
  forbidden: [raw_transcript, tool_output, prompt, secret, native_history]
failure_policy: fail_closed
holds:
  classes: [busy, integrity, schema, identity, permission, backup, conflict]
  receipts: classification_only
projections:
  authority: rebuildable_non_authoritative
  checkpoint: sequence_and_payload_hash
backup:
  restore: staged_fresh_target_only
  overwrite_existing: forbidden
  receipt: [sha256, project_id, schema_version, generation, source_head]
limits:
  max_events_per_batch: 100
  max_batch_bytes: 1048576
  max_json_depth: 12
