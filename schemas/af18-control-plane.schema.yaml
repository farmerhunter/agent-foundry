$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-foundry.local/schemas/af18-control-plane.schema.yaml"
title: AF18 MVP-1 Control-Plane Packet
type: object
additionalProperties: false
required:
  - work
  - execution_run
  - dispatch_claim
  - requested_route
properties:
  work:
    type: object
    additionalProperties: false
    required:
      - work_id
      - issue
      - role
      - phase
      - root_budget_tokens
      - remaining_budget_tokens
      - durable_anchors
      - stop_conditions
    properties:
      work_id:
        type: string
        minLength: 1
      issue:
        type: integer
        minimum: 1
      role:
        type: string
        minLength: 1
      phase:
        type: string
        minLength: 1
      root_budget_tokens:
        type: integer
        minimum: 1
      remaining_budget_tokens:
        type: integer
        minimum: 0
      durable_anchors:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      stop_conditions:
        type: array
        items:
          type: string
          minLength: 1
  execution_run:
    type: object
    additionalProperties: false
    required:
      - run_id
      - work_id
      - role
      - state
      - context
      - model
    properties:
      run_id:
        type: string
        minLength: 1
      work_id:
        type: string
        minLength: 1
      role:
        type: string
        minLength: 1
      state:
        enum:
          - active
          - successor_required
          - hold_required
          - completed
      context:
        type: object
        additionalProperties: false
        required:
          - source_timestamp
          - threshold_band
          - estimated_context_tokens
        properties:
          source_timestamp:
            type: string
            format: date-time
          threshold_band:
            enum:
              - generic_default
              - coordinator_routing_status_readback
              - architect_design_gate
              - implementer_small_scoped_implementation
              - reviewer_exact_pr_review
              - tester_focused_validation
          estimated_context_tokens:
            type: integer
            minimum: 0
          max_context_tokens:
            type: integer
            minimum: 1
            maximum: 12000
          max_age_hours:
            type: integer
            minimum: 1
          threshold_exception:
            type: object
            additionalProperties: false
            required:
              - issue
              - role
              - temporary_cap
              - reason
              - expiry
            properties:
              issue:
                type: integer
                minimum: 1
              role:
                type: string
                minLength: 1
              temporary_cap:
                type: integer
                minimum: 1
                maximum: 12000
              reason:
                type: string
                minLength: 1
              expiry:
                type: string
                format: date-time
      model:
        type: object
        additionalProperties: false
        required:
          - name
          - reasoning
        properties:
          name:
            type: string
            minLength: 1
          reasoning:
            enum:
              - minimal
              - low
              - medium
              - high
          human_escalation_approval:
            type: object
            additionalProperties: false
            required:
              - issue
              - role
              - model
              - reasoning
              - purpose
              - budget
            properties:
              issue:
                type: integer
                minimum: 1
              role:
                type: string
                minLength: 1
              model:
                type: string
                minLength: 1
              reasoning:
                type: string
                minLength: 1
              purpose:
                type: string
                minLength: 1
              budget:
                type: string
                minLength: 1
  dispatch_claim:
    type: object
    additionalProperties: false
    required:
      - idempotency_key
      - work_id
      - role
      - decision_boundary
      - durable_anchor
    properties:
      idempotency_key:
        type: string
        minLength: 1
      work_id:
        type: string
        minLength: 1
      role:
        type: string
        minLength: 1
      decision_boundary:
        type: string
        minLength: 1
      durable_anchor:
        type: string
        minLength: 1
  requested_route:
    enum:
      - bounded_subagent
      - visible_interactive
      - external_provider
      - privileged_runtime
  existing_dispatch_claims:
    type: array
    items:
      type: object
  active_runs:
    type: array
    items:
      type: object
