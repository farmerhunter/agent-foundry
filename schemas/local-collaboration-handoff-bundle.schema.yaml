$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-foundry.local/schemas/local-collaboration-handoff-bundle.schema.yaml
title: LocalCollaborationHandoffBundle-v1
type: object
additionalProperties: false
required: [schema_version, project_id, bundle_id, handoff_id, source_replica_id, target_replica_id, source_replica_epoch, target_replica_epoch, source_enrollment_id, source_enrollment_digest, target_enrollment_id, target_enrollment_digest, source_generation, source_head, source_state_digest, frontier_digest, content_manifest_digest, events, export_marker, package_digest, flags]
properties:
  schema_version: {const: LocalCollaborationHandoffBundle-v1}
  project_id: {type: string, format: uuid}
  bundle_id: {$ref: '#/$defs/opaque'}
  handoff_id: {$ref: '#/$defs/opaque'}
  source_replica_id: {$ref: '#/$defs/opaque'}
  target_replica_id: {$ref: '#/$defs/opaque'}
  source_replica_epoch: {type: integer, minimum: 1}
  target_replica_epoch: {type: integer, minimum: 1}
  source_enrollment_id: {$ref: '#/$defs/opaque'}
  source_enrollment_digest: {$ref: '#/$defs/digest'}
  target_enrollment_id: {$ref: '#/$defs/opaque'}
  target_enrollment_digest: {$ref: '#/$defs/digest'}
  source_generation: {type: integer, minimum: 0}
  source_head: {$ref: '#/$defs/digest'}
  source_state_digest: {$ref: '#/$defs/digest'}
  frontier_digest: {$ref: '#/$defs/digest'}
  content_manifest_digest: {$ref: '#/$defs/digest'}
  events:
    type: array
    minItems: 1
    maxItems: 100
    items: {$ref: '#/$defs/event'}
  export_marker: {$ref: '#/$defs/event'}
  package_digest: {$ref: '#/$defs/digest'}
  flags:
    type: object
    additionalProperties: false
    required: [owner_import_performed, owner_readback_verified, target_activation_authorized, transport_performed]
    properties:
      owner_import_performed: {const: false}
      owner_readback_verified: {const: false}
      target_activation_authorized: {const: false}
      transport_performed: {const: false}
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  opaque: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
  event:
    type: object
    additionalProperties: false
    required: [sequence, event_id, event_type, payload, payload_hash, previous_hash, event_hash, created_at, actor, source, root]
    properties:
      sequence: {type: integer, minimum: 1}
      event_id: {type: string, format: uuid}
      event_type: {type: string, minLength: 1, maxLength: 128}
      payload: {}
      payload_hash: {$ref: '#/$defs/digest'}
      previous_hash: {$ref: '#/$defs/digest'}
      event_hash: {$ref: '#/$defs/digest'}
      created_at: {type: string}
      actor: {type: [string, 'null']}
      source: {type: [string, 'null']}
      root: {type: string, format: uuid}
  owner_import_projection:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, project_id, bundle_id, handoff_id, phase, handoff_status, source_generation, source_head, source_state_digest, frontier_digest, target_generation, target_head, receipt_event_id, package_digest, owner_import_verified, target_activation_authorized, flags]
    properties:
      schema_version: {const: LocalCollaborationHandoffBundle-v1}
      outcome: {const: owner_import_verified}
      project_id: {type: string, format: uuid}
      bundle_id: {$ref: '#/$defs/opaque'}
      handoff_id: {$ref: '#/$defs/opaque'}
      phase: {const: source_locked}
      handoff_status: {const: bundle_exported}
      source_generation: {type: integer, minimum: 0}
      source_head: {$ref: '#/$defs/digest'}
      source_state_digest: {$ref: '#/$defs/digest'}
      frontier_digest: {$ref: '#/$defs/digest'}
      target_generation: {type: integer, minimum: 0}
      target_head: {$ref: '#/$defs/digest'}
      receipt_event_id: {type: string, format: uuid}
      package_digest: {$ref: '#/$defs/digest'}
      owner_import_verified: {const: true}
      target_activation_authorized: {const: false}
      flags:
        type: object
        additionalProperties: false
        required: [owner_import_performed, owner_readback_verified, target_activation_authorized, transport_performed]
        properties:
          owner_import_performed: {type: boolean}
          owner_readback_verified: {const: true}
          target_activation_authorized: {const: false}
          transport_performed: {const: false}
  owner_target_activation:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, project_id, bundle_id, package_digest, handoff_id, target_replica_id, target_generation, target_head, import_receipt_event_id, import_receipt_event_hash, activation_receipt_event_id, activation_receipt_event_hash, decision_digest, request_digest, owner_import_verified, target_activation_authorized, target_activation_performed, transport_performed, global_convergence_verified, source_unlock_performed]
    properties:
      schema_version: {const: LocalCollaborationHandoffBundle-v1}
      outcome: {enum: [owner_target_activated, owner_target_activation_duplicate]}
      project_id: {type: string, format: uuid}
      bundle_id: {$ref: '#/$defs/opaque'}
      package_digest: {$ref: '#/$defs/digest'}
      handoff_id: {$ref: '#/$defs/opaque'}
      target_replica_id: {$ref: '#/$defs/opaque'}
      target_generation: {type: integer, minimum: 0}
      target_head: {$ref: '#/$defs/digest'}
      import_receipt_event_id: {type: string, format: uuid}
      import_receipt_event_hash: {$ref: '#/$defs/digest'}
      activation_receipt_event_id: {type: string, format: uuid}
      activation_receipt_event_hash: {$ref: '#/$defs/digest'}
      decision_digest: {$ref: '#/$defs/digest'}
      request_digest: {$ref: '#/$defs/digest'}
      owner_import_verified: {const: true}
      target_activation_authorized: {const: true}
      target_activation_performed: {type: boolean}
      transport_performed: {const: false}
      global_convergence_verified: {const: false}
      source_unlock_performed: {const: false}
  owner_target_activation_hold:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, project_id, reason_code, flags]
    properties:
      schema_version: {const: LocalCollaborationHandoffBundle-v1}
      outcome:
        enum: [hold_schema, hold_project_identity, hold_decision_invalid, hold_privacy, hold_package_integrity, hold_proof_missing_or_stale, hold_target_stale, hold_enrollment, hold_owner_busy, hold_owner_permission, hold_owner_integrity, hold_readback_ambiguous, hold_activation_conflict]
      project_id: {type: string, format: uuid}
      reason_code: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9_]+$'}
      flags:
        type: object
        additionalProperties: false
        required: [owner_import_performed, owner_readback_verified, target_activation_authorized, transport_performed]
        properties:
          owner_import_performed: {const: false}
          owner_readback_verified: {const: false}
          target_activation_authorized: {const: false}
          transport_performed: {const: false}
