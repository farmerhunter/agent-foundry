$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-foundry.local/schemas/bounded-collaboration-onboarding.schema.yaml"
title: Bounded Collaboration Legacy Diagnostic Router
description: >-
  Closed legacy-request and v2 read-only routing contract. This surface is not
  authority for native threads, readiness, dispatch, Vault writes, or runtime activation.
oneOf:
  - $ref: "#/$defs/LegacyRequest"
  - $ref: "#/$defs/DiagnosticResult"
$defs:
  NonEmptyString:
    type: string
    minLength: 1
  Capability:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {enum: [supported, unavailable, unknown]}
  LegacyRequest:
    type: object
    additionalProperties: false
    required:
      - onboarding_version
      - request
      - runtime_capabilities
      - role_hub
      - current_thread
      - existing_roles
      - repository_state
    properties:
      onboarding_version: {const: bounded-collaboration-onboarding-v1}
      request:
        type: object
        additionalProperties: false
        required: [project_identity, onboarding_key, apply_authorized]
        properties:
          project_identity:
            type: object
            additionalProperties: false
            required: [project_id, repository, integration_branch]
            properties:
              project_id: {$ref: "#/$defs/NonEmptyString"}
              repository: {type: string, pattern: "^[^/]+/[^/]+$"}
              integration_branch: {$ref: "#/$defs/NonEmptyString"}
          onboarding_key: {$ref: "#/$defs/NonEmptyString"}
          apply_authorized: {type: boolean}
          role_display_names:
            type: object
            additionalProperties: false
            properties:
              Coordinator: {$ref: "#/$defs/NonEmptyString"}
              Architect: {$ref: "#/$defs/NonEmptyString"}
      runtime_capabilities:
        type: object
        additionalProperties: false
        required: [role_binding, projections, operations]
        properties:
          role_binding: {$ref: "#/$defs/Capability"}
          projections:
            type: object
            additionalProperties: false
            required: [role_hub, current_thread, scheduler, transient_template]
            properties:
              role_hub: {$ref: "#/$defs/Capability"}
              current_thread: {$ref: "#/$defs/Capability"}
              scheduler:
                type: object
                additionalProperties: false
                required: [status, binding_ref, binding_status]
                properties:
                  status: {enum: [supported, unavailable, unknown]}
                  binding_ref: {$ref: "#/$defs/NonEmptyString"}
                  binding_status: {enum: [bound, unavailable]}
              transient_template:
                type: object
                additionalProperties: false
                required: [status, template_refs]
                properties:
                  status: {enum: [supported, unavailable, unknown]}
                  template_refs:
                    type: object
                    additionalProperties: false
                    required: [Implementer, Reviewer, Tester, Harvester]
                    properties:
                      Implementer: {$ref: "#/$defs/NonEmptyString"}
                      Reviewer: {$ref: "#/$defs/NonEmptyString"}
                      Tester: {$ref: "#/$defs/NonEmptyString"}
                      Harvester: {$ref: "#/$defs/NonEmptyString"}
          operations:
            type: object
            additionalProperties: false
            required: [discover, create, rename, link, navigate]
            properties:
              discover: {$ref: "#/$defs/Capability"}
              create: {$ref: "#/$defs/Capability"}
              rename: {$ref: "#/$defs/Capability"}
              link: {$ref: "#/$defs/Capability"}
              navigate: {$ref: "#/$defs/Capability"}
      role_hub:
        type: object
        additionalProperties: false
        required: [status]
        properties:
          status: {enum: [missing, active, held, ambiguous]}
          role_hub_ref: {$ref: "#/$defs/NonEmptyString"}
      current_thread:
        type: object
        additionalProperties: false
        required: [eligible, current_thread_ref, name]
        properties:
          eligible: {type: boolean}
          current_thread_ref: {$ref: "#/$defs/NonEmptyString"}
          name: {$ref: "#/$defs/NonEmptyString"}
      existing_roles:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [project_id, role, role_ref, durable_anchor, state, legacy]
          properties:
            project_id: {$ref: "#/$defs/NonEmptyString"}
            role: {enum: [Coordinator, Architect, Implementer, Reviewer, Tester, Harvester]}
            role_ref: {$ref: "#/$defs/NonEmptyString"}
            durable_anchor: {$ref: "#/$defs/NonEmptyString"}
            state: {enum: [active, held, historical_reference]}
            legacy: {type: boolean}
            display_name: {$ref: "#/$defs/NonEmptyString"}
            linked_to_role_hub: {type: boolean}
      repository_state:
        type: object
        additionalProperties: false
        required: [dirty, dirty_preserved]
        properties:
          dirty: {type: boolean}
          dirty_preserved: {type: boolean}
      operation_receipts:
        type: array
        items: {$ref: "#/$defs/OperationReceipt"}
      rollback_receipts:
        type: array
        items: {$ref: "#/$defs/RollbackReceipt"}
  OperationReceipt:
    type: object
    additionalProperties: false
    required: [idempotency_key, status]
    properties:
      idempotency_key: {$ref: "#/$defs/NonEmptyString"}
      status: {enum: [applied, failed, not_attempted]}
      receipt_ref: {$ref: "#/$defs/NonEmptyString"}
      operation_fingerprint: {$ref: "#/$defs/NonEmptyString"}
      result_ref: {$ref: "#/$defs/NonEmptyString"}
    allOf:
      - if:
          properties:
            status: {enum: [applied, failed]}
        then:
          required: [receipt_ref, operation_fingerprint]
      - if:
          properties:
            status: {const: applied}
        then:
          required: [result_ref]
  RollbackReceipt:
    type: object
    additionalProperties: false
    required:
      - source_idempotency_key
      - status
      - receipt_ref
      - source_operation_fingerprint
      - rollback_fingerprint
    properties:
      source_idempotency_key: {$ref: "#/$defs/NonEmptyString"}
      status: {enum: [applied, failed]}
      receipt_ref: {$ref: "#/$defs/NonEmptyString"}
      source_operation_fingerprint: {$ref: "#/$defs/NonEmptyString"}
      rollback_fingerprint: {$ref: "#/$defs/NonEmptyString"}
  DiagnosticResult:
    type: object
    additionalProperties: false
    required:
      - onboarding_version
      - read_only
      - mutation_performed
      - dispatch_performed
      - state
      - stop_conditions
      - operations
      - rollback_operations
      - next_route
      - role_hub
      - safe_next_action
    properties:
      onboarding_version: {const: bounded-collaboration-onboarding-v2}
      read_only: {const: true}
      mutation_performed: {const: false}
      dispatch_performed: {const: false}
      state: {enum: [owner_composed_route_required, partial_hold]}
      stop_conditions:
        type: array
        uniqueItems: true
        items: {enum: [invalid_legacy_request, privacy_sensitive_input]}
      operations:
        type: array
        maxItems: 0
      rollback_operations:
        type: array
        maxItems: 0
      next_route:
        type: object
        additionalProperties: false
        required: [entrypoint, mode, required_locators, fresh_owner_readback_required]
        properties:
          entrypoint: {const: scripts/bounded_collaboration_runtime_bridge.py}
          mode: {const: read_only_preflight}
          required_locators:
            const: [projects_root, project_root, onboarding_key]
          fresh_owner_readback_required: {const: true}
      role_hub:
        type: object
        additionalProperties: false
        required: [classification, affects_native_readiness]
        properties:
          classification: {const: optional_read_only_projection}
          affects_native_readiness: {const: false}
      safe_next_action:
        enum:
          - Run the public locator-only owner-composed preflight with fresh owner locators.
          - Repair the legacy compatibility request before using the owner-composed preflight.
    allOf:
      - if:
          properties:
            state: {const: owner_composed_route_required}
        then:
          properties:
            stop_conditions: {maxItems: 0}
      - if:
          properties:
            state: {const: partial_hold}
        then:
          properties:
            stop_conditions: {minItems: 1}
