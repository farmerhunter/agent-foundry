$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-foundry.local/schemas/bounded-collaboration-onboarding.schema.yaml"
title: Native Bounded Collaboration Onboarding
description: >-
  Side-effect-free planning and receipt contract for Coordinator plus Durable
  Architect onboarding. RoleHub is logical; private task-state discovery is forbidden.
type: object
additionalProperties: false
oneOf:
  - required: [onboarding_version, request, runtime_capabilities, existing_roles, repository_state]
    not: {required: [state]}
  - $ref: "#/$defs/PlanResult"
properties:
  onboarding_version: {const: bounded-collaboration-onboarding-v2}
  request:
    type: object
    additionalProperties: false
    required: [project_identity, onboarding_key, apply_authorized, reuse_policy, handshake_requested]
    properties:
      project_identity:
        type: object
        additionalProperties: false
        required: [project_id, repository, integration_branch]
        properties:
          project_id: {type: string, minLength: 1}
          repository: {type: string, pattern: "^[^/]+/[^/]+$"}
          integration_branch: {type: string, minLength: 1}
      onboarding_key: {type: string, minLength: 1}
      apply_authorized: {type: boolean}
      reuse_policy: {enum: [fresh_only, reuse_allowed]}
      handshake_requested: {type: boolean}
      role_display_names:
        type: object
        additionalProperties: false
        properties:
          Coordinator: {type: string, minLength: 1}
          Durable Architect: {type: string, minLength: 1}
  runtime_capabilities:
    type: object
    additionalProperties: false
    required: [operations]
    properties:
      operations:
        type: object
        additionalProperties: false
        required: [list_projects, list_threads, create_thread, read_thread, wait_threads, send_message_to_thread]
        properties:
          list_projects: {$ref: "#/$defs/Capability"}
          list_threads: {$ref: "#/$defs/Capability"}
          create_thread: {$ref: "#/$defs/Capability"}
          read_thread: {$ref: "#/$defs/Capability"}
          wait_threads: {$ref: "#/$defs/Capability"}
          send_message_to_thread: {$ref: "#/$defs/Capability"}
  existing_roles:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [project_id, role, thread_id, state]
      properties:
        project_id: {type: string, minLength: 1}
        role: {enum: [Coordinator, Durable Architect]}
        thread_id: {type: string, minLength: 1}
        state: {enum: [active, held, historical_reference]}
        display_name: {type: string, minLength: 1}
  repository_state:
    type: object
    additionalProperties: false
    required: [dirty, dirty_preserved]
    properties:
      dirty: {type: boolean}
      dirty_preserved: {type: boolean}
  operation_receipts:
    type: array
    items: {$ref: "#/$defs/OperationReceipt"}
  read_only: {const: true}
  mutation_performed: {const: false}
  dispatch_performed: {const: false}
  state: {type: string}
  transition_history: {type: array}
  stop_conditions: {type: array}
  operations: {type: array}
  rollback_operations: {type: array}
  summary: {type: object}
$defs:
  Capability:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {enum: [supported, unavailable, unknown]}
  PlanResult:
    type: object
    additionalProperties: false
    required: [onboarding_version, read_only, mutation_performed, dispatch_performed, state, transition_history, stop_conditions, operations, summary]
    properties:
      onboarding_version: {const: bounded-collaboration-onboarding-v2}
      read_only: {const: true}
      mutation_performed: {const: false}
      dispatch_performed: {const: false}
      state: {enum: [plan_ready, applying, setup_pending, ready, partial_hold]}
      transition_history:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      stop_conditions:
        type: array
        items: {type: string, minLength: 1}
      operations:
        type: array
        items: {$ref: "#/$defs/Operation"}
      rollback_operations:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, subject, source_idempotency_key, automatic, never_delete_or_archive]
          properties:
            kind: {const: mark_setup_incomplete}
            subject: {enum: [Coordinator, Durable Architect]}
            source_idempotency_key: {type: string, minLength: 1}
            automatic: {const: false}
            never_delete_or_archive: {const: true}
      summary: {$ref: "#/$defs/OnboardingSummary"}
  Operation:
    type: object
    additionalProperties: false
    required: [kind, subject, idempotency_key, preimage, desired_state, operation_fingerprint]
    properties:
      kind: {enum: [resolve_saved_project, create_thread, reuse_thread, owner_readback, peer_handshake_send, peer_handshake_readback]}
      subject: {enum: [Project, Coordinator, Durable Architect]}
      idempotency_key: {type: string, minLength: 1}
      preimage: {type: object}
      desired_state: {type: object}
      depends_on:
        type: array
        items: {type: string, minLength: 1}
      operation_fingerprint: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  OperationReceipt:
    type: object
    additionalProperties: false
    required: [idempotency_key, status]
    properties:
      idempotency_key: {type: string, minLength: 1}
      status: {enum: [applied, failed, not_attempted, setup_pending]}
      receipt_ref: {type: string, minLength: 1}
      operation_fingerprint: {type: string, minLength: 1}
      result_ref: {type: string, minLength: 1}
      pending_task_id: {type: string, minLength: 1}
      evidence: {type: object}
  OnboardingSummary:
    type: object
    additionalProperties: false
    required: [project_identity, capability, reuse_policy, roles, held, role_hub, historical_references, dirty_state, work_assigned, private_history_scanned, duplicate_create_allowed, native_onboarding_receipt, next_human_action]
    properties:
      project_identity: {type: object}
      capability: {enum: [complete, unavailable]}
      reuse_policy: {enum: [fresh_only, reuse_allowed, null]}
      roles:
        type: object
        additionalProperties: false
        required: [Coordinator, Durable Architect]
        properties:
          Coordinator: {$ref: "#/$defs/RoleState"}
          Durable Architect: {$ref: "#/$defs/RoleState"}
      held:
        type: array
        items: {type: string}
      role_hub: {type: object}
      historical_references: {type: array, maxItems: 0}
      dirty_state: {type: object}
      work_assigned: {const: false}
      private_history_scanned: {const: false}
      duplicate_create_allowed: {const: false}
      native_onboarding_receipt: {type: [object, "null"]}
      next_human_action: {type: string, minLength: 1}
  RoleState:
    type: object
    additionalProperties: false
    required: [accepted, initialized, acknowledged, ready]
    properties:
      accepted: {type: boolean}
      initialized: {type: boolean}
      acknowledged: {type: [boolean, string]}
      ready: {type: boolean}
