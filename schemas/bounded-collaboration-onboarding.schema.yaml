$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-foundry.local/schemas/bounded-collaboration-onboarding.schema.yaml"
title: Bounded Collaboration Onboarding Plan
description: >-
  Portable metadata-only planning contract, not authority for native threads,
  transcript access, Vault writes, or runtime activation.
type: object
additionalProperties: false
required: [onboarding_version, request, runtime_capabilities, existing_roles, repository_state]
properties:
  onboarding_version:
    const: bounded-collaboration-onboarding-v1
  request:
    type: object
    additionalProperties: false
    required: [project_identity, onboarding_key, apply_authorized]
    properties:
      project_identity:
        type: object
        additionalProperties: false
        required: [project_id, repository, integration_branch]
        properties:
          project_id: {type: string, minLength: 1}
          repository: {type: string, pattern: "^[^/]+/[^/]+$"}
          integration_branch: {type: string, minLength: 1}
      onboarding_key: {type: string, minLength: 1}
      apply_authorized: {type: boolean}
      role_display_names:
        type: object
        additionalProperties: false
        properties:
          Coordinator: {type: string, minLength: 1}
          Architect: {type: string, minLength: 1}
  runtime_capabilities:
    type: object
    additionalProperties: false
    required: [role_binding]
    properties:
      role_binding:
        type: object
        additionalProperties: false
        required: [status]
        properties:
          status: {enum: [supported, unavailable, unknown]}
      projections:
        type: object
        additionalProperties: false
        required: [role_hub, current_thread, scheduler, transient_template]
        properties:
          role_hub: {$ref: "#/$defs/Capability"}
          current_thread: {$ref: "#/$defs/Capability"}
          scheduler: {$ref: "#/$defs/Capability"}
          transient_template: {$ref: "#/$defs/Capability"}
      operations:
        type: object
        additionalProperties: false
        required: [discover, create, rename, link, navigate]
        properties:
          discover: {$ref: "#/$defs/Capability"}
          create: {$ref: "#/$defs/Capability"}
          rename: {$ref: "#/$defs/Capability"}
          link: {$ref: "#/$defs/Capability"}
          navigate: {$ref: "#/$defs/Capability"}
  role_hub:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {enum: [missing, active, held, ambiguous]}
      role_hub_ref: {type: string, minLength: 1}
  existing_roles:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [project_id, role, role_ref, durable_anchor, state, legacy]
      properties:
        project_id: {type: string, minLength: 1}
        role: {enum: [Coordinator, Architect, Implementer, Reviewer, Tester, Harvester]}
        role_ref: {type: string, minLength: 1}
        durable_anchor: {type: string, minLength: 1}
        state: {enum: [active, held, historical_reference]}
        legacy: {type: boolean}
        display_name: {type: string, minLength: 1}
        linked_to_role_hub: {type: boolean}
  repository_state:
    type: object
    additionalProperties: false
    required: [dirty, dirty_preserved]
    properties:
      dirty: {type: boolean}
      dirty_preserved: {type: boolean}
  operation_receipts:
    type: array
    items: {$ref: "#/$defs/OperationReceipt"}
  rollback_receipts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [source_idempotency_key, status, receipt_ref]
      properties:
        source_idempotency_key: {type: string, minLength: 1}
        status: {enum: [applied, failed]}
        receipt_ref: {type: string, minLength: 1}
  plan_result:
    $ref: "#/$defs/PlanResult"
$defs:
  Capability:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {enum: [supported, unavailable, unknown]}
  PlanResult:
    type: object
    required: [state, transition_history, operations, summary]
    properties:
      state: {enum: [preflight, plan_ready, applying, ready, partial_hold, rollback_planned, rolled_back, rollback_incomplete]}
      transition_history:
        type: array
        minItems: 1
        items: {type: string}
      operations:
        type: array
      summary:
        type: object
  OperationReceipt:
    type: object
    additionalProperties: false
    required: [idempotency_key, status]
    properties:
      idempotency_key: {type: string, minLength: 1}
      status: {enum: [applied, failed, not_attempted]}
      receipt_ref: {type: string, minLength: 1}
      operation_fingerprint: {type: string, minLength: 1}
    allOf:
      - if:
          properties:
            status: {enum: [applied, failed]}
        then:
          required: [receipt_ref, operation_fingerprint]
