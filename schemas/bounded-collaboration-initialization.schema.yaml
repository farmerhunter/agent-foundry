$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-foundry.local/schemas/bounded-collaboration-initialization.schema.yaml"
title: Bounded Collaboration Initialization Receipt
description: Owner-composed, privacy-safe completion receipt; no caller claims are authority.
type: object
additionalProperties: false
required: [contract_version, onboarding_key, completion_state, mutation_performed, attention_reason, safe_next_action]
properties:
  contract_version: {const: bounded-collaboration-initialization-v1}
  onboarding_key: {type: string, minLength: 1}
  completion_state:
    enum: [native_ready, repo_contract_only, unavailable, partial_hold, topology_plan_ready, setup_incomplete]
  mutation_performed: {type: boolean}
  attention_reason: {type: [string, "null"]}
  safe_next_action: {type: string, minLength: 1}
  topology_plan:
    type: object
    additionalProperties: false
    required: [contract_version, onboarding_key, project_binding_ref, project_binding_digest, scheduler_binding_digest, requested_roles, topology_preimage_digest, original_completion_preimage, topology_plan_digest]
    properties:
      contract_version: {const: bounded-collaboration-initialization-v1}
      onboarding_key: {type: string, minLength: 1}
      project_binding_ref: {type: string, minLength: 1}
      project_binding_digest: {type: string, minLength: 1}
      scheduler_binding_digest: {type: string, minLength: 1}
      requested_roles: {const: [Coordinator, Architect]}
      topology_preimage_digest: {type: string, minLength: 1}
      original_completion_preimage: {const: absent}
      topology_plan_digest: {type: string, minLength: 1}
  project_binding_ref: {type: string, minLength: 1}
  project_binding_digest: {type: string, minLength: 1}
  rolehub_ref: {type: string, minLength: 1}
  coordinator_ref: {type: string, minLength: 1}
  architect_ref: {type: string, minLength: 1}
  topology_readback_digest: {type: string, minLength: 1}
  topology_apply_binding_ref: {type: string, minLength: 1}
  topology_apply_binding_digest: {type: string, minLength: 1}
  scheduler_binding_ref: {type: string, minLength: 1}
  work_root_ref: {type: string, minLength: 1}
  scheduler_binding_revision: {type: string, minLength: 1}
  scheduler_binding_digest: {type: string, minLength: 1}
  repo_contract_status: {const: not_authoritative}
  operation_receipt_refs:
    type: array
    items: {type: string, minLength: 1}
allOf:
  - if: {properties: {completion_state: {const: native_ready}}}
    then:
      required: [project_binding_ref, project_binding_digest, rolehub_ref, coordinator_ref, architect_ref, topology_readback_digest, scheduler_binding_ref, work_root_ref, scheduler_binding_revision, scheduler_binding_digest, repo_contract_status, operation_receipt_refs]
  - if: {properties: {completion_state: {const: topology_plan_ready}}}
    then: {required: [topology_plan]}
  - if:
      required: [operation_receipt_refs]
      properties:
        completion_state: {const: native_ready}
        operation_receipt_refs: {minItems: 1}
    then: {required: [topology_apply_binding_ref, topology_apply_binding_digest]}
