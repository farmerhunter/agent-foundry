$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-foundry.local/schemas/bounded-collaboration-native-topology-owner.schema.yaml
title: Bounded collaboration native topology public envelopes
$defs:
  applyBinding:
    type: object
    additionalProperties: false
    required: [topology_apply_binding_ref, topology_apply_binding_digest, topology_plan_digest, onboarding_key, project_binding_digest, scheduler_binding_digest, operation_receipt_refs, operation_receipt_refs_digest, requested_roles, coordinator_ref, architect_ref, topology_readback_digest]
    properties:
      topology_apply_binding_ref: {type: string, minLength: 1}
      topology_apply_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      topology_plan_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      onboarding_key: {type: string, minLength: 1}
      project_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      scheduler_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      operation_receipt_refs: {type: array, minItems: 2, maxItems: 2, items: {type: string, minLength: 1}}
      operation_receipt_refs_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      requested_roles: {const: [Coordinator, Architect]}
      coordinator_ref: {type: string, minLength: 1}
      architect_ref: {type: string, minLength: 1}
      topology_readback_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
oneOf:
  - type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: missing}}
  - type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: absent}}
  - type: object
    additionalProperties: false
    required: [state, reason]
    properties: {state: {const: held}, reason: {type: string, minLength: 1}}
  - type: object
    additionalProperties: false
    required: [state, owner_version, coordinator_ref, architect_ref, project_binding_digest, project_id, topology_readback_digest, topology_apply_binding_ref, topology_apply_binding_digest, coordinator_count, architect_count, topology_apply_binding]
    properties:
      state: {const: ready}
      owner_version: {const: bounded-collaboration-native-topology-owner-v2}
      coordinator_ref: {type: string}
      architect_ref: {type: string}
      project_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      project_id: {type: string}
      topology_readback_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      topology_apply_binding_ref: {type: string}
      topology_apply_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      coordinator_count: {const: 1}
      architect_count: {const: 1}
      topology_apply_binding: {$ref: '#/$defs/applyBinding'}
  - type: object
    additionalProperties: false
    required: [state, owner_version, completion_receipt_ref, onboarding_key, coordinator_ref, architect_ref, project_binding_ref, project_binding_digest, scheduler_binding_ref, work_root_ref, scheduler_binding_revision, scheduler_binding_digest, topology_plan_digest, topology_apply_binding_ref, topology_apply_binding_digest, topology_readback_digest, operation_receipt_refs]
    properties:
      state: {const: ready}
      owner_version: {const: bounded-collaboration-native-topology-owner-v2}
      completion_receipt_ref: {type: string}
      onboarding_key: {type: string}
      coordinator_ref: {type: string}
      architect_ref: {type: string}
      project_binding_ref: {type: string}
      project_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      scheduler_binding_ref: {type: string}
      work_root_ref: {type: string}
      scheduler_binding_revision: {type: string}
      scheduler_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      topology_plan_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      topology_apply_binding_ref: {type: string}
      topology_apply_binding_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      topology_readback_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      operation_receipt_refs: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
