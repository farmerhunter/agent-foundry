$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-foundry.dev/schemas/rolehub-adapter-execution.schema.yaml
title: Portable RoleHub adapter execution contract
type: object
required: [contract_version, project_id, rolehub_identity, operations]
additionalProperties: false
properties:
  contract_version: {type: string, const: AF18-rolehub-adapter-v1}
  project_id: {type: string, minLength: 1}
  rolehub_identity:
    type: object
    required: [logical_id]
    additionalProperties: false
    properties:
      logical_id: {type: string, minLength: 1}
      role_conversations: {type: array, items: {type: string}}
  capabilities:
    type: object
    additionalProperties: false
    properties:
      create: {type: string, enum: [supported, unavailable, unsupported, unknown]}
      link: {type: string, enum: [supported, unavailable, unsupported, unknown]}
      navigate: {type: string, enum: [supported, unavailable, unsupported, unknown]}
  role_matches:
    type: array
    items:
      type: object
      required: [role, project_id, active]
      properties:
        role: {type: string, enum: [Coordinator, Architect, Implementer, Reviewer, Tester, Harvester]}
        project_id: {type: string}
        active: {type: boolean}
        legacy: {type: boolean}
  capability_evidence:
    type: object
    required: [trusted, producer, runtime_id, project_id, logical_rolehub_id]
    additionalProperties: false
    properties:
      trusted: {type: boolean, const: true}
      producer: {type: string, minLength: 1}
      runtime_id: {type: string, minLength: 1}
      project_id: {type: string, minLength: 1}
      logical_rolehub_id: {type: string, minLength: 1}
  operations:
    type: array
    items:
      type: object
      required: [operation_id, action, idempotency_key]
      additionalProperties: false
      properties:
        operation_id: {type: string, minLength: 1}
        action: {type: string, enum: [create, reuse, link, navigate]}
        idempotency_key: {type: string, minLength: 1}
        role: {type: string}
        target_ref: {type: string}
        preimage: {type: [object, 'null']}
        receipt:
          type: [object, 'null']
          required: [operation_id, idempotency_key, operation_fingerprint, opaque_ref, readback, sequence, status]
          properties:
            operation_id: {type: string, minLength: 1}
            idempotency_key: {type: string, minLength: 1}
            operation_fingerprint: {type: string, pattern: '^sha256:'}
            opaque_ref: {type: string, minLength: 1}
            readback: {type: object}
            sequence: {type: integer, minimum: 0}
            status: {type: string, enum: [applied, ready, partial_hold, rolled_back, rollback_incomplete]}
            project_id: {type: string, minLength: 1}
            logical_rolehub_id: {type: string, minLength: 1}
  rollback:
    type: object
    properties:
      status: {type: string, enum: [required, complete, failed]}
      receipt: {type: object}
      reversed_operation_ids: {type: array, items: {type: string}}
