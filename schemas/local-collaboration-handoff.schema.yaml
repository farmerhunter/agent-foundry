$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-foundry.local/schemas/local-collaboration-handoff.schema.yaml
title: LocalCollaborationHandoff-v1
oneOf:
  - $ref: '#/$defs/request'
  - $ref: '#/$defs/receipt'
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  opaque: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
  uuid: {type: string, format: uuid}
  request:
    type: object
    additionalProperties: false
    required: [transition, project_id]
    properties:
      transition: {enum: [enroll_initial, enroll_target, revoke_inactive, prepare, source_lock, bundle_exported, cancel, takeover, target_activate]}
      project_id: {$ref: '#/$defs/uuid'}
      replica_id: {$ref: '#/$defs/opaque'}
      replica_epoch: {type: integer, minimum: 1}
      enrollment_id: {$ref: '#/$defs/opaque'}
      enrollment_digest: {$ref: '#/$defs/digest'}
      decision_id: {$ref: '#/$defs/opaque'}
      decision_digest: {$ref: '#/$defs/digest'}
      handoff_id: {$ref: '#/$defs/opaque'}
      source_replica_id: {$ref: '#/$defs/opaque'}
      target_replica_id: {$ref: '#/$defs/opaque'}
      frontier_digest: {$ref: '#/$defs/digest'}
      cancellation_evidence: {enum: [bundle_not_released, target_non_activation_readback]}
      prior_frontier_digest: {$ref: '#/$defs/digest'}
      bundle_id: {$ref: '#/$defs/opaque'}
      content_manifest_digest: {$ref: '#/$defs/digest'}
  receipt:
    type: object
    additionalProperties: false
    required: [schema_version, outcome, project_id, flags]
    properties:
      schema_version: {const: LocalCollaborationHandoff-v1}
      outcome:
        enum: [enrolled, prepared, source_locked, bundle_exported, cancelled, taken_over, target_active, a2_import_candidate, hold_schema, hold_privacy, hold_project_identity, hold_enrollment, hold_revoked, hold_epoch, hold_transition, hold_stale_snapshot, hold_overlap_conflict, hold_cancellation_unproven, hold_owner_integrity, hold_owner_busy, hold_owner_permission, hold_readback_ambiguous, hold_a2_owner_proof_unavailable]
      transition: {enum: [enroll_initial, enroll_target, revoke_inactive, prepare, source_lock, bundle_exported, cancel, takeover, target_activate]}
      project_id: {$ref: '#/$defs/uuid'}
      event_ids:
        type: array
        minItems: 1
        maxItems: 8
        items: {$ref: '#/$defs/uuid'}
      request_digest: {$ref: '#/$defs/digest'}
      before_state_digest: {$ref: '#/$defs/digest'}
      after_state_digest: {$ref: '#/$defs/digest'}
      readback_generation: {type: integer, minimum: 0}
      readback_head: {$ref: '#/$defs/digest'}
      reason_code: {$ref: '#/$defs/opaque'}
      cas_status: {enum: [appended, duplicate]}
      handoff_id: {$ref: '#/$defs/opaque'}
      state_digest: {$ref: '#/$defs/digest'}
      owner_import_performed: {const: false}
      import_authorized: {const: false}
      requires_owner_verification: {const: true}
      flags:
        type: object
        additionalProperties: false
        required: [owner_persisted, owner_readback_verified, bundle_exported, owner_import_performed, transport_performed]
        properties:
          owner_persisted: {type: boolean}
          owner_readback_verified: {type: boolean}
          bundle_exported: {type: boolean}
          owner_import_performed: {const: false}
          transport_performed: {const: false}
allOf:
  - if:
      properties: {outcome: {pattern: '^hold_'}}
      required: [outcome]
    then:
      required: [reason_code]
