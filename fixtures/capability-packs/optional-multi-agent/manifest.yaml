manifest_schema_version: 1
pack_id: pack.multi-agent.optional
title: Optional Multi-Agent Collaboration Pack
description: Reviewed public snapshot of Agent Foundry's bounded GitHub collaboration and role-dispatch guidance.
lifecycle_status: reviewed
version: 0.5.0
exported_at: 2026-09-01
distribution_type: optional_capability
source_provenance: "Agent Foundry issue #579 using accepted #576 source from Vault PR #16 and Core PR #583."
maintainer_contact: "https://github.com/farmerhunter/agent-foundry"
license: "repository license"
sensitivity: public
review_state: reviewed

pack_contract:
  promised_use_case: "Provide reviewable bounded GitHub Issue/PR collaboration and role-dispatch guidance without requiring the maintainer's private Vault."
  deployment_role: "optional user-selected capability after bootstrap"
  source_authority_after_deployment: "selected User Vault records"
  non_authority_boundaries: [generated adapters are downstream only, runtime installs are downstream only, pack staging and Core fixtures are transfer evidence only]

evidence_sources:
  - "Agent Foundry issue 576 accepted canonical collaboration source"
  - "Agent Foundry Core pull request 583 accepted public delivery"
  - "Agent Foundry issue 579 package membership and upgrade review"

export_policy:
  exportability: review_required
  privacy_class: sanitized
  excluded_material: [private paths, credentials, raw sessions, usage rows, local receipts, project state, repository-specific merge grants]
  review_required: true

runtime_projection:
  downstream_only: true
  generated_adapter_intent: generated_adapter_projection
  runtime_install: review_required
  authority: downstream_only

lifecycle_policy:
  split_behavior: review_required
  merge_behavior: review_required
  deprecation_behavior: review_required
  update_behavior: reviewed_diff_required

compatibility:
  core_schema_version_min: 1
  core_schema_version_max: 1
  vault_layout_versions: [1]
  requires_bootstrap_pack: true

upgrade_mapping:
  from_version: 0.4.0
