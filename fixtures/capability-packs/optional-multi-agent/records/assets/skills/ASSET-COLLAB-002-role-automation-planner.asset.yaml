  - Prepare or initialize a role-session prompt
  - Plan an explicitly requested agent reminder or recurring automation
  - Map an approved role workflow to another runtime
  - Fresh native Coordinator and Durable Architect onboarding
success_criteria:
  - An ordinary PR request does not trigger role automation; dispatch requests consume the Work contract without loading Agent Collaboration and every reference again.
  - Existing suitable sessions are preferred; current tool availability, actual dispatch and completion are reported separately.
  - Recurrence is never inferred from a one-shot task; role count does not determine workspace count.
  - Prompts preserve current scope, holds, one writer, dependencies and Human gates; no runtime-enforcement or native-readiness claim comes from prompt text.
  - GitHub remains durable handoff authority; callbacks are notifications and portable fallbacks are labelled.
  - No native RoleHub requirement, private runtime-state write, automatic Harvest/activation or unintended broad queue drain is introduced.
  - fresh_only never reads, reuses, renames or archives old tasks; unresolved pending setup holds without private scanning or duplicate create_thread calls.
  - A requested handshake uses one owner, the same token, explicit reply_to_thread_id and cursor-aware readback after both real thread IDs are initialized.
  - Native readiness is reported only by a NativeOnboardingReceipt that separates accepted, initialized, acknowledged and ready.
review_cadence: monthly
review_after_days: 60
evidence_summary: "#576 narrowed dispatch/session/recurrence ownership. v16 harvests native onboarding dogfood where pending IDs, private-session recovery, duplicate repair and stale wait results made a prompt-heavy flow unreliable; delivery and lifecycle policy remain with their canonical owners."
