usage_triggers:
  - Implement or review a GitHub issue or pull request
  - Coordinate an Epic or dependency-gated Work handoff
  - Resume repository work or plan authorized workspace cleanup
  - Diagnose or explicitly onboard bounded multi-agent collaboration
success_criteria:
  - Ordinary Issue/PR work loads its authority and delivery guidance, not onboarding, scheduling or cleanup procedures without their trigger.
  - The requested operation reaches verification and its authorized handoff; dispatch, design acceptance, code integration and runtime activation remain distinct claims.
  - No explicit hold or privacy/security/destructive/canonical/runtime boundary is bypassed; no redundant Human gate is invented for delegated steps.
  - Workspace selection preserves one writer and Epic integration preference; cleanup and future Work never inherit permission from a merge alone.
  - Positive, negative and specialist-delegation requests choose a clear owner; reference lookup does not chain through the entire asset library.
  - Blockers and repairs remain decision-relevant; ordinary cost estimates are not measured telemetry and no small-sample trial or score is fabricated.
review_cadence: monthly
review_after_days: 90
evidence_summary: "#576 proposed content synthesis of existing delivery, lean-contract and owner-routing guidance. All canonical practice memberships are retained; long procedures move to their conditionally selected existing owners, not a second authority."
