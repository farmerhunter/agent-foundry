id: ASSET-COLLAB-001
title: Agent Collaboration
asset_type: skill
status: active
version: 39
created: 2026-05-28
updated: 2026-08-31
purpose: Deliver GitHub Issue/PR work and coordinate Epic, handoff and workspace lifecycle decisions.
discovery_description: "Use for GitHub Issue/PR delivery, review handoff, Epic coordination or workspace lifecycle. Not for every code task. Delegate role-session/automation planning to Role Automation Planner and reusable-lesson changes to Practice Harvester."
responsibility: Own durable Work scope, delivery authority, review/handoff and truthful completion; select the applicable existing practice before acting.
non_responsibility: Does not own domain architecture, canonical Harvest, runtime installation or detailed role automation; mentioning a repository alone does not invoke this workflow.
inputs:
  - Current user request, repository policy and issue/PR/Epic scope
  - Relevant current branch/workspace, dependencies, review evidence and next owner
  - Only for the selected operation, Project state, runtime locators or explicit external prerequisite
process:
  - Identify the requested operation; load COLLAB-001 for authority and only the matching practice_routes before acting. A reference catalogue is not an instruction to read everything or follow every Related Practices link.
  - If intent or rule applicability is uncertain, state legacy fallback, inspect only relevant existing rules, and resolve the uncertainty before the affected action; never silently load the full library or expand authority.
  - For Work execution or handoff, apply COLLAB-009 to make outcome, writer, branch/target, relevant checks and next owner clear; reuse durable decisions and the adopted adaptive-isolation/Epic policy.
  - Perform already-authorized checks, task commits, push and PR updates without repeated approval; explicit holds and protected boundaries remain binding.
  - Verify current candidate behavior and finish against the original task, not implementation momentum. Classify failed evidence before requesting product repair; use the lean review/repair rules, not extra role counts or repeated same-environment trials.
  - Record what changed, verification, residuals and next permitted action on the existing issue/PR; coordinate labels/Project only when the requested transition warrants it.
  - For a role dispatch or schedule, hand the bounded Work and authority to Role Automation Planner. Do not load its full policy for ordinary delivery or mistake a copied prompt for dispatch.
  - For explicit bounded onboarding, follow COLLAB-017 public locator-only preflight; report owner-backed project/control/scheduler state or hold. Native apply needs its own authorization and readback; two default persistent roles are Coordinator and Durable Architect, not RoleHub, and two roles are not a project-wide thread cap.
  - For an architecture decision use Architecture Design; for reusable lessons, skills, packs or canonical publication use Practice Harvester. Passing issue checks does not activate canonical or installed content.
  - Before a protected effect or final closure, check current authority and evidence again. Explain any real Human decision in chat; if an unavailable external prerequisite is decisive, hold with one resume condition instead of inventing substitute Work.
outputs:
  - Scoped delivery or review with durable evidence, next owner and explicit merge/closure status
  - Applicable permission/hold or specialist handoff, not an automatic new role or framework
