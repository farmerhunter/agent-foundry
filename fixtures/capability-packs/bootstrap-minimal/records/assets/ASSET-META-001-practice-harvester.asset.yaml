id: ASSET-META-001
title: Practice Harvester
asset_type: skill
status: active
version: 6
created: 2026-05-26
updated: 2026-08-18
purpose: Maintain reusable practices, assets, and capability packs by harvesting lessons, discovering reusable skills/assets, importing external skills, publishing adapters, and reviewing skill rot.
responsibility: Maintain the Agent Foundry lifecycle of practices, assets, capability-pack review workflows, indexes, adapters, usage evidence, and related review reports.
non_responsibility: Does not perform domain-specific engineering work except to harvest or package reusable lessons from it.
inputs:
  - current session context
  - linked issue, PR, commit, or roadmap history when the user asks to review a whole session or phase
  - external skill source
  - capability pack root, deployed pack id, or transfer package when the user asks for pack review
  - existing practice and asset indexes
  - recent work history when discovering assets
process:
  - locate and validate the current Agent Foundry Core and Vault
  - reconstruct the relevant session or correction
  - when harvesting skills or assets from a long session, set an explicit evidence window that includes earlier phases, linked issues, PRs, and commits rather than only the latest discussion topic
  - route artifacts before drafting candidates
  - apply the generalization gate
  - classify candidate practices or assets
  - for asset discovery, choose create, extend, skip, or defer using the smallest suitable asset rule
  - deduplicate against indexes
  - present a concise review list before canonical mutation
  - apply approved items
  - publish relevant adapters only after approved canonical changes are applied
  - when asked to evaluate or discover a capability pack, read `workflows/discover-capability-packs.md`, produce candidate or false-positive evidence only, and keep writes disabled
  - when asked to preview capability pack deployment, run `scripts/plan_capability_pack.py` with the selected Vault and report review gates before any apply
  - when asked to apply a reviewed capability pack, require the accepted review/approval evidence, run the reviewed apply path, then publish or inspect downstream adapters separately
  - when asked to review a capability pack lifecycle transition, read `workflows/manage-capability-pack-lifecycle.md`, use dry-run lifecycle reports first, and preserve human gates for activation, exportability, split, merge, deprecation, disable, or retire
  - when asked to preview capability pack export or import, read `workflows/export-import-capability-packs.md` and use privacy-safe transfer validation with `writes: none`
outputs:
  - harvest report or review list
  - asset discovery review list
  - capability pack candidate, deployment preview, lifecycle report, or transfer review
  - proposed or active practice entries
  - active asset records
  - updated indexes
  - updated adapters
  - review report
